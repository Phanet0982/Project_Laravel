<!DOCTYPE html>
<html>
<head>
    <title>QR Generation Test</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3>QR Generation Test</h3>
                    </div>
                    <div class="card-body">
                        <button id="testQr" class="btn btn-primary">Test QR Generation</button>
                        <div id="result" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        $('#testQr').click(function() {
            $('#result').html('<div class="alert alert-info">Testing QR generation...</div>');
            
            $.ajaxSetup({
                headers: {
                    'X-CSRF-TOKEN': $('meta[name="csrf-token"]').attr('content') || 'test-token'
                }
            });
            
            $.post('/test/generate-qr', {
                amount: 25.50
            })
            .done(function(data) {
                $('#result').html(`
                    <div class="alert alert-success">
                        <h5>Success!</h5>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `);
            })
            .fail(function(xhr, status, error) {
                $('#result').html(`
                    <div class="alert alert-danger">
                        <h5>Error: ${status}</h5>
                        <p><strong>Response:</strong></p>
                        <pre>${xhr.responseText}</pre>
                    </div>
                `);
            });
        });
    </script>
</body>
</html>
