<!DOCTYPE html>
<html>
<head>
    <title>Stock Backup Test</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3>Stock Backup System Test</h3>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <button id="testCreate" class="btn btn-primary">Test Create Backup</button>
                            <button id="testList" class="btn btn-secondary">Test List Backups</button>
                        </div>
                        <div id="result" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get CSRF token from meta tag or use a test token
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || 'test-token';
        
        $('#testCreate').click(function() {
            $('#result').html('<div class="alert alert-info">Testing backup creation...</div>');
            
            $.ajaxSetup({
                headers: {
                    'X-CSRF-TOKEN': csrfToken
                }
            });
            
            $.post('/stock-backup/create', {
                name: 'Test Backup ' + new Date().toLocaleTimeString(),
                description: 'Automated test backup'
            })
            .done(function(data) {
                $('#result').html(`
                    <div class="alert alert-success">
                        <h5>Success!</h5>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `);
            })
            .fail(function(xhr, status, error) {
                $('#result').html(`
                    <div class="alert alert-danger">
                        <h5>Error: ${status}</h5>
                        <p><strong>Response:</strong></p>
                        <pre>${xhr.responseText}</pre>
                    </div>
                `);
            });
        });
        
        $('#testList').click(function() {
            $('#result').html('<div class="alert alert-info">Testing backup listing...</div>');
            
            $.get('/stock-backup/list')
            .done(function(data) {
                $('#result').html(`
                    <div class="alert alert-success">
                        <h5>Success!</h5>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `);
            })
            .fail(function(xhr, status, error) {
                $('#result').html(`
                    <div class="alert alert-danger">
                        <h5>Error: ${status}</h5>
                        <p><strong>Response:</strong></p>
                        <pre>${xhr.responseText}</pre>
                    </div>
                `);
            });
        });
    </script>
</body>
</html>
